<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="min-vh-100 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <h1 class="h3 mb-1">Acceso RH</h1>
                            <p class="text-secondary mb-4">Sistema de control de asistencia</p>

                            {% if form.errors %}
                                <div class="alert alert-danger" role="alert">
                                    Usuario o contraseña inválidos.
                                </div>
                            {% endif %}

                            <form method="post" novalidate>
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                                    <input class="form-control form-control-lg" type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" autocomplete="username" required autofocus>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                                    <input class="form-control form-control-lg" type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
                                </div>
                                <button class="btn btn-primary btn-lg w-100" type="submit">Ingresar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
