<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login RH</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 320px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: 0; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Acceso RH</h2>
        {% if form.errors %}<p style="color:red">Credenciales inválidas.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.username.label_tag }} {{ form.username }}
            {{ form.password.label_tag }} {{ form.password }}
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
