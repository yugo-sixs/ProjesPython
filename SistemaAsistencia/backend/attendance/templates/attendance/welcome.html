<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Checado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f3;
            color: #1f2937;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: #ffffff;
            color: #0f172a;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 440px;
            text-align: center;
            border-top: 6px solid #22c55e;
        }
        .banner {
            background: #16a34a;
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: bold;
        }
        h1 { margin-top: 0; color: #166534; }
        p { color: #475569; }
        a {
            display: block;
            margin: 12px 0;
            padding: 12px;
            text-decoration: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }
        a:hover { background: linear-gradient(135deg, #16a34a, #15803d); }
    </style>
</head>
<body>
    <div class="box">
        <div class="banner">Sistema de Checado</div>
        <h1>Bienvenido</h1>
        <p>Seleccione una opción para continuar.</p>
        <a href="/rh/login/">Iniciar sesión</a>
        <a href="/admin/">Panel de administración</a>
    </div>
</body>
</html>
