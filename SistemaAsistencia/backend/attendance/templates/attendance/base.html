<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RH Dashboard{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        nav { background: #0f172a; color: white; padding: 16px 24px; }
        nav a { color: white; text-decoration: none; margin-right: 16px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f8fafc; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .stat { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .muted { color: #64748b; }
        .btn { display: inline-block; padding: 8px 12px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'rh-dashboard' %}">Dashboard</a>
            <a href="{% url 'rh-employees' %}">Empleados</a>
            <a href="{% url 'rh-schedules' %}">Horarios</a>
            <a href="{% url 'rh-attendance-report' %}">Reporte de asistencias</a>
            <a href="/admin/">Admin</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
