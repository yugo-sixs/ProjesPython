<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Panel RH{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="{% url 'rh-dashboard' %}">Panel RH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRh">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarRh">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{% url 'rh-dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rh-employees' %}">Empleados</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rh-schedules' %}">Horarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rh-attendance-report' %}">Reporte de asistencias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/">Admin Django</a></li>
                </ul>
                <a class="btn btn-outline-light btn-sm" href="/logout/">Cerrar sesión</a>
            </div>
        </div>
    </nav>
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
